<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <title>DOM 1</title>
</head>
<body style="background-color: #cccc;">
    <div class="row">
        <div class="col-4 offset-4">
            <div class="card">
                <div class="card-body">
                    <label for="input">Ingresa tu nombre:</label>
                    <input type="text" id="input" class="form-control">
                    <button class="btn btn-primary" id="boton">enviar saludo</button>

                    <p id="resultado">Hola</p>
                </div>

            </div>
        </div>
    </div>
    
    <script>
        const nombreinput = document.getElementById("input");
        const boton= document.getElementById("boton");
        const resultadoParr=document.getElementById("resultado");
        
        boton.addEventListener("click", function() {
            
            const nombre = nombreinput.value;

            resultadoParr.textContent = `¡Hola, ${nombre}! Bienvenida.`;
        });
    </script>
</body>
</html>
