<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <title>DOM 3</title>
</head>
<body>
    <div class="row">
        <div class="col-6 offset-4">
            <div class="card">
                <div class="card-body">
                    <label for="boton">Vista previa de texto</label>
                    <Input type="text" class="form" id="ingresado"></Input>

                    <p id="previously"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ingreso = document.getElementById("ingresado");
        const parrafo = document.getElementById("previously");

        ingreso.addEventListener("input", function() {
            parrafo.textContent= `${ingreso.value}`;
        })
    </script>
</body>
</html>
