<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles.css">
    <title>DOM 13</title>
</head>

<body>
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 mt-3">
            <div class="card mx-auto">
                <div class="card-body">
                    <h2>Selector de imágenes a partir de miniaturas</h2>

                    <div class="d-flex mx-auto">
                        <button class="off mx-auto">
                            <img src="./img/perrito1.jpg" alt="perrito 1" class="miniaturas">
                        </button>
                        <button class="off mx-auto">
                            <img src="./img/perrito2.jpg" alt="perrito 2" class="miniaturas">
                        </button>
                        <button class="off mx-auto">
                            <img src="./img/perrito3.jpg" alt="perrito 3" class="miniaturas">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 mt-3">
            <div class="card mx-auto">
                <div class="card-body">
                    <h3 class="text-center">Título</h3>
                    <div class="contenedor-de-imagenn">
                        <img src="./img/vacio.jpeg" alt="imagen vacía" class="principal" id="principal">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./javascript.js"></script>
</body>

</html>
